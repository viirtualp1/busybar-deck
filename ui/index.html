<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Deck — BUSY Bar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#editor">Skip to settings</a>

    <header class="bar">
      <div class="bar-title"><strong>Deck</strong></div>
      <button id="open-palette" class="search" title="Search (Ctrl+K)">
        <span class="search-text">Jump to an app or a setting</span>
        <span class="search-keys"><kbd>Ctrl</kbd><kbd>K</kbd></span>
      </button>
    </header>

    <main class="shell">
      <aside class="rail">
        <section class="screen" aria-label="What the Bar is showing">
          <div class="screen-stack">
            <figure class="panel front">
              <img id="front" alt="Front display" />
              <figcaption>front · 72×16</figcaption>
            </figure>
            <figure class="panel back">
              <img id="back" alt="Back display" />
              <figcaption>back · 160×80</figcaption>
            </figure>
          </div>
          <div class="now">
            <button id="unpin" class="ghost small" hidden>Release the screen</button>
          </div>
        </section>

        <nav class="apps" aria-label="Apps">
          <h2 class="rail-head">Apps</h2>
          <ul id="app-list" class="app-list"></ul>
          <button id="add-app" class="add-app" type="button">+ Add app</button>
        </nav>
      </aside>

      <section id="editor" class="editor" aria-live="polite">
        <div id="empty" class="empty">
          <h1>Pick an app</h1>
          <p class="muted">
            Everything an app can be configured by comes from the app itself, so this list
            grows when you install one.
          </p>
        </div>
        <article id="app-view" hidden>
          <div id="app-alert" class="alert" role="status" hidden></div>
          <header class="app-head">
            <div>
              <h1 id="app-name">
                <i id="app-dot" class="on-air" title="On screen now" hidden></i>
                <span id="app-name-text">—</span>
              </h1>
              <p id="app-summary" class="muted"></p>
            </div>
            <div class="app-actions">
              <button id="pin" class="ghost">Put on screen</button>
              <button id="restart" class="ghost">Restart</button>
            </div>
          </header>
          <div id="sections"></div>
        </article>
      </section>
    </main>

    <div id="savebar" class="savebar" hidden role="status">
      <span id="savebar-text">No changes</span>
      <div class="savebar-actions">
        <button id="discard" class="ghost">Discard</button>
        <button id="save" class="primary">Save</button>
      </div>
    </div>

    <div id="palette" class="palette" hidden>
      <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
        <input
          id="palette-input"
          type="text"
          placeholder="Jump to an app or a setting…"
          autocomplete="off"
        />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <div id="installer" class="palette" hidden>
      <div
        class="dialog-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="installer-title"
      >
        <header class="dialog-head">
          <h2 id="installer-title">Add an app</h2>
          <button id="installer-close" class="ghost small" type="button">Close</button>
        </header>
        <input
          id="installer-search"
          class="dialog-search"
          type="text"
          placeholder="Search BUSY Bar apps on npm…"
          autocomplete="off"
        />
        <ul id="installer-list" class="catalog"></ul>
        <form id="installer-form" class="installer-form">
          <label class="wide">
            <span>Package</span>
            <input
              id="installer-package"
              type="text"
              placeholder="busybar-something"
              autocomplete="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            <span>Name</span>
            <input
              id="installer-name"
              type="text"
              placeholder="something"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label>
            <span>Priority</span>
            <input id="installer-rank" type="number" value="30" min="0" max="1000" />
          </label>
          <button id="installer-go" class="primary" type="submit">Install</button>
        </form>
        <pre id="installer-log" class="installer-log" hidden></pre>
      </div>
    </div>

    <output id="toast" class="toast" hidden></output>

    <script type="module" src="app.js"></script>
  </body>
</html>
